        <!-- Store structured data -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": ["Store", "OnlineStore"],
                "name": "Ihmom Store",
                "alternateName": "الهموم ستور",
                "url": "https://ihmom-store.com/",
                "logo": "https://ihmom-store.com/icon-512.png",
                "image": [
                    "https://ihmom-store.com/og-image.png",
                    "https://ihmom-store.com/images/ihmom-store-preview.jpg"
                ],
                "telephone": "+970-566-009514",
                "description": "متجر الهموم للهواتف والأراجيل والفيب والمباخر وإكسسوارات الكمبيوتر والقيمنق وألعاب الأطفال في فلسطين.",
                "areaServed": {
                    "@type": "Country",
                    "name": "Palestine"
                },
                "currenciesAccepted": "ILS",
                "paymentAccepted": "Cash on delivery"
            }
        </script>

        <!-- Initialize theme and language before React renders -->
        <script>
            (function () {
                const root = document.documentElement;

                try {
                    const savedTheme = localStorage.getItem('theme');

                    const systemPrefersDark = window.matchMedia(
                        '(prefers-color-scheme: dark)',
                    ).matches;

                    const theme =
                        savedTheme === 'light' || savedTheme === 'dark'
                            ? savedTheme
                            : systemPrefersDark
                              ? 'dark'
                              : 'light';

                    root.dataset.theme = theme;
                    root.classList.toggle('dark', theme === 'dark');
                } catch {
                    root.dataset.theme = 'light';
                    root.classList.remove('dark');
                }

                try {
                    const savedLanguage = localStorage.getItem('store-language');

                    const browserLanguage = navigator.language.split('-')[0].toLowerCase();

                    const language =
                        savedLanguage === 'ar' || savedLanguage === 'en'
                            ? savedLanguage
                            : browserLanguage === 'en'
                              ? 'en'
                              : 'ar';

                    root.lang = language;
                    root.dir = language === 'ar' ? 'rtl' : 'ltr';
                } catch {
                    root.lang = 'ar';
                    root.dir = 'rtl';
                }
            })();
        </script>
    </head>

    <body>
        <div id="root"></div>

        <script type="module" src="/src/main.tsx"></script>
    </body>
