<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Ihmom Store | Online Shopping</title>

        <meta
            name="description"
            content="Shop hookahs, vaping products, incense burners, computer accessories, gaming products, and more at Ihmom Store. Explore products, compare prices, and order online with convenient cash on delivery."
        />
        <meta name="author" content="Ihmom Store" />
        <meta name="application-name" content="Ihmom Store" />
        <meta name="theme-color" content="#F5F4F0" />
        <meta name="color-scheme" content="light dark" />

        <link rel="canonical" href="https://ihmom-store.com/" />

        <meta property="og:site_name" content="Ihmom Store" />
        <meta property="og:title" content="Ihmom Store | Online Shopping" />
        <meta property="og:type" content="website" />
        <meta
            property="og:description"
            content="Discover hookahs, vaping products, incense burners, computer accessories, gaming products, and more at Ihmom Store."
        />
        <meta property="og:url" content="https://ihmom-store.com/" />
        <meta
            property="og:image"
            content="https://ihmom-store.com/images/ihmom-store-preview.jpg"
        />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Ihmom Store storefront in Turmus Ayya" />
        <meta name="twitter:image:alt" content="Ihmom Store storefront in Turmus Ayya" />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Ihmom Store | Online Shopping" />
        <meta
            name="twitter:description"
            content="Explore products, compare prices, and order online at Ihmom Store."
        />
        <meta
            name="twitter:image"
            content="https://ihmom-store.com/images/ihmom-store-preview.jpg"
        />

        <link rel="icon" type="image/png" href="/icon.png" />

        <script>
            (function () {
                const root = document.documentElement;

                try {
                    const savedTheme = localStorage.getItem('theme');

                    const systemPrefersDark = window.matchMedia(
                        '(prefers-color-scheme: dark)',
                    ).matches;

                    const theme =
                        savedTheme === 'light' || savedTheme === 'dark'
                            ? savedTheme
                            : systemPrefersDark
                              ? 'dark'
                              : 'light';

                    root.dataset.theme = theme;
                    root.classList.toggle('dark', theme === 'dark');
                } catch {
                    root.dataset.theme = 'light';
                    root.classList.remove('dark');
                }

                try {
                    const savedLanguage = localStorage.getItem('store-language');

                    const browserLanguage = navigator.language.split('-')[0].toLowerCase();

                    const language =
                        savedLanguage === 'ar' || savedLanguage === 'en'
                            ? savedLanguage
                            : browserLanguage === 'ar'
                              ? 'ar'
                              : 'en';

                    root.lang = language;
                    root.dir = language === 'ar' ? 'rtl' : 'ltr';
                } catch {
                    root.lang = 'en';
                    root.dir = 'ltr';
                }
            })();
        </script>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
