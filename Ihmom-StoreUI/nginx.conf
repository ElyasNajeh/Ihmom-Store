
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_cookie_path /auth /api/auth;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://api:8000/uploads/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
