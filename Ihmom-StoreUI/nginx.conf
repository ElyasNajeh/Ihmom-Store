
# Rendered by the official Nginx image's envsubst entrypoint. Trust only the
# host-facing gateway; never accept forwarded headers from other containers.
map "$realip_remote_addr:$http_x_forwarded_proto" $client_scheme {
    default $scheme;
    "${TRUSTED_EDGE_PROXY_IP}:https" https;
    "${TRUSTED_EDGE_PROXY_IP}:http" http;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    set_real_ip_from ${TRUSTED_EDGE_PROXY_IP};
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $client_scheme;
    proxy_set_header Forwarded "";

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_cookie_path /auth /api/auth;
    }

    location /uploads/ {
        proxy_pass http://api:8000/uploads/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
