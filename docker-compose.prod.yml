
name: ihmom-store

services:

  redis:
    image: redis:8.2-alpine
    container_name: ihmom-store-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:17
    container_name: ihmom-store-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:?DATABASE_USER is required} -d ${DATABASE_NAME:?DATABASE_NAME is required}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================
  # Adminer
  # =========================
  adminer:
    image: adminer:latest
    container_name: ihmom-store-adminer
    restart: unless-stopped

    environment:
      ADMINER_DEFAULT_SERVER: postgres

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

  # =========================
  # FastAPI
  # =========================
  api:
    build:
      context: ./Ihmom-StoreAPI
      dockerfile: Dockerfile.prod

    container_name: ihmom-store-api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8001:8000"

    networks:
      default:
      proxy:
        ipv4_address: ${IHMOM_PROXY_API_IP:-172.30.254.2}

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Apply migrations before starting FastAPI
    command:
      - sh
      - -c
      - |
        python -m alembic upgrade head &&
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips ${IHMOM_PROXY_UI_IP:-172.30.254.3}

  # =========================
  # React Production Build
  # =========================
  ui:
    build:
      context: ./Ihmom-StoreUI
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}

    container_name: ihmom-store-ui
    restart: unless-stopped

    ports:
      - "127.0.0.1:5174:80"

    environment:
      TRUSTED_EDGE_PROXY_IP: ${IHMOM_PROXY_GATEWAY:-172.30.254.1}
      NGINX_ENVSUBST_FILTER: ^TRUSTED_EDGE_PROXY_IP$$

    # Only the API and UI join this dedicated proxy network. The host's
    # loopback-published connection reaches UI through its gateway.
    networks:
      proxy:
        ipv4_address: ${IHMOM_PROXY_UI_IP:-172.30.254.3}

    depends_on:
      - api

# =========================
# Volumes
# =========================
volumes:
  postgres_data:
  uploads_data:

# Keep the existing default network for PostgreSQL/Redis/adminer/API. Fixed
# proxy addresses make the trust boundary survive container recreation.
networks:
  proxy:
    ipam:
      config:
        - subnet: ${IHMOM_PROXY_SUBNET:-172.30.254.0/29}
          gateway: ${IHMOM_PROXY_GATEWAY:-172.30.254.1}
