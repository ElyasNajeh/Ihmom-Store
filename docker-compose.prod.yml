
name: ihmom-store

services:

  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:17
    container_name: ihmom-store-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:?DATABASE_USER is required} -d ${DATABASE_NAME:?DATABASE_NAME is required}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================
  # Adminer
  # =========================
  adminer:
    image: adminer:latest
    container_name: ihmom-store-adminer
    restart: unless-stopped

    environment:
      ADMINER_DEFAULT_SERVER: postgres

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

  # =========================
  # FastAPI
  # =========================
  api:
    build:
      context: ./Ihmom-StoreAPI
      dockerfile: Dockerfile.prod

    container_name: ihmom-store-api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

    # Apply migrations before starting FastAPI
    command:
      - sh
      - -c
      - |
        python -m alembic upgrade head &&
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000

  # =========================
  # React Production Build
  # =========================
  ui:
    build:
      context: ./Ihmom-StoreUI
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}

    container_name: ihmom-store-ui
    restart: unless-stopped

    ports:
      - "127.0.0.1:5173:80"

    depends_on:
      - api

# =========================
# Volumes
# =========================
volumes:
  postgres_data:
  uploads_data:
